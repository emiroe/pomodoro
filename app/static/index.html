<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12141a"><title>Pomodoro</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pomodoro"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{color-scheme:dark;--bg:#0e1015;--card:#1c202b;--card2:#242937;--line:#2c3243;--txt:#eef0f6;--dim:#8b93a7;--focus:#ff6b4a;--brk:#34c759;--ok:#2fa84f;--accent:#7c9cff}
@media(prefers-color-scheme:light){:root{color-scheme:light;--bg:#f2f4f8;--card:#fff;--card2:#eef1f6;--line:#dde2ec;--txt:#161a24;--dim:#69728a;--accent:#4f6bff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:900px;margin:0 auto;padding:14px 14px 60px}
.top{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:nowrap}
h1{flex:1;font-size:20px;margin:0;letter-spacing:-.02em;white-space:nowrap}
h2{font-size:13px;margin:0 0 8px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);font:inherit;font-weight:600;padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}.btn.sm{padding:4px 10px;font-size:13px}
.btn.ico{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}@media(min-width:780px){.stats{grid-template-columns:repeat(6,1fr)}}   /* 12 tiles: always full rows */
.stat{background:var(--card2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:21px;font-variant-numeric:tabular-nums}.stat span{color:var(--dim);font-size:12px}
.bar{height:10px;background:var(--card2);border-radius:99px;overflow:hidden;display:flex;margin:8px 0 4px}.bar i{display:block;height:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--txt);font:inherit;border-radius:10px;padding:8px 10px;min-width:0}
input:focus,select:focus{outline:none;border-color:var(--accent)}
input[type=color]{padding:2px;width:38px;height:34px}
form .row>*{flex:1 1 120px}
.seg{display:inline-flex;background:var(--card2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--dim);font:inherit;font-weight:600;font-size:13px;padding:4px 11px;border-radius:999px;cursor:pointer;text-transform:none;letter-spacing:0}
.seg button.on{background:var(--accent);color:#fff}
.tpanel{display:flex;align-items:center;gap:18px;padding:14px;border-radius:16px;background:linear-gradient(135deg,var(--card2),color-mix(in srgb,var(--pc) 16%,var(--card2)));--pc:var(--focus)}
.tpanel.brk{--pc:var(--brk)}
.ring{--p:0;flex:none;width:136px;height:136px;border-radius:50%;padding:7px;background:conic-gradient(var(--pc) calc(var(--p)*1deg),color-mix(in srgb,var(--dim) 25%,transparent) 0)}
.ring.run{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 22px color-mix(in srgb,var(--pc) 60%,transparent)}}
.ring .in{width:100%;height:100%;border-radius:50%;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center}
.timer{font-size:30px;font-variant-numeric:tabular-nums;font-weight:750;letter-spacing:-.02em}
.ring small{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.tside{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.tside button.big{display:flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:700;font-size:16px;color:#fff;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.25);background:linear-gradient(135deg,#34c759,#1f9d45)}
.tside button.big.pause{background:linear-gradient(135deg,#f5a524,#d97706)}
.tside button.big:active{transform:scale(.97)}
.tsub{display:flex;flex-wrap:wrap;gap:6px}.tsub .btn{flex:1 1 auto;padding:6px 8px;font-size:12px}   /* wraps instead of running off the card */
.dots{display:flex;gap:5px;justify-content:center;min-height:10px}.dots i{width:9px;height:9px;border-radius:50%;background:color-mix(in srgb,var(--dim) 35%,transparent)}.dots i.d{background:var(--focus)}
.hm{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.hm .wd{display:grid;grid-template-rows:repeat(7,12px);gap:3px;margin-top:19px;font-size:10px;color:var(--dim);line-height:12px;text-align:right;flex:none}
.hm .cols{display:grid;grid-auto-flow:column;grid-auto-columns:12px;grid-template-rows:14px repeat(7,12px);gap:3px;margin-right:6px;padding:2px 0}
.hm .mo{font-size:10px;color:var(--dim);white-space:nowrap;overflow:visible;line-height:14px;display:flex;justify-content:center;width:12px}
.hm .c{width:12px;height:12px;border-radius:3px;background:var(--card2)}.hm .c.n{background:none}
.hm,.hl{--h1:#d8ec84;--h2:#c2e070;--h3:#aad45f;--h4:#92c850;--h5:#7ab943;--h6:#62a838;--h7:#4c962f;--h8:#388427;--h9:#2a731f;--h10:#1f6318}
.hm .c.l1,.hl .c.l1{background:var(--h1)}.hm .c.l2,.hl .c.l2{background:var(--h2)}.hm .c.l3,.hl .c.l3{background:var(--h3)}.hm .c.l4,.hl .c.l4{background:var(--h4)}.hm .c.l5,.hl .c.l5{background:var(--h5)}.hm .c.l6,.hl .c.l6{background:var(--h6)}.hm .c.l7,.hl .c.l7{background:var(--h7)}.hm .c.l8,.hl .c.l8{background:var(--h8)}.hm .c.l9,.hl .c.l9{background:var(--h9)}.hm .c.l10,.hl .c.l10{background:var(--h10)}
.hm .c.t{outline:1.5px solid var(--accent)}
.hl{display:flex;align-items:center;justify-content:flex-end;gap:4px;color:var(--dim);font-size:11px;margin-top:6px}
.hl .c{width:11px;height:11px;border-radius:3px;display:inline-block;background:var(--card2)}
.pr{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}.pr .n{width:34%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:6px}
.pr .bar{flex:1;margin:0}.pr .v{width:64px;text-align:right;color:var(--dim);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.day{margin-top:12px;font-weight:700;display:flex;justify-content:space-between}.day span{color:var(--dim);font-weight:500}
.sess{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.sess .m{flex:1;min-width:0}.sess .m small{color:var(--dim);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sess .d{font-variant-numeric:tabular-nums;font-weight:600}
.set{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}.set label{font-size:12px;color:var(--dim);display:flex;flex-direction:column;gap:3px}
.pj{display:flex;align-items:center;gap:8px;margin-top:8px}.pj input[type=text]{flex:1}
.tw{border-bottom:1px solid var(--line)}.tw:last-child{border-bottom:0}.tw.drag{opacity:.55;background:var(--card2);border-radius:8px}
.td{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;line-height:1.3}
.td input[type=checkbox]{width:15px;height:15px;flex:none;accent-color:var(--ok);margin:0}
.td span{flex:1;min-width:0;overflow-wrap:anywhere}.td.done span{text-decoration:line-through;color:var(--dim)}
.td .h{flex:none;cursor:grab;color:var(--dim);touch-action:none;user-select:none;-webkit-user-select:none;font-size:13px;line-height:1;letter-spacing:-2px;padding:2px 3px 2px 0}
.td .sb{flex:none;border:1px solid var(--line);border-radius:6px;font-size:10px;font-weight:600;min-width:24px;padding:1px 4px;color:var(--dim)}.td .sb.on{background:var(--card2);color:var(--txt)}
.subs{padding:0 0 8px 28px}.sub{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px;line-height:1.3}.sub input[type=checkbox]{width:13px;height:13px;flex:none;accent-color:var(--ok);margin:0}
.sub span{flex:1;min-width:0;overflow-wrap:anywhere}.sub.done span{text-decoration:line-through;color:var(--dim)}.sub button{border:0;background:none;color:var(--dim);font-size:11px;cursor:pointer;padding:0 4px}
.td .tx,.sub span{cursor:text}
.subs .sa{width:100%;margin-top:3px;font-size:12px;padding:5px 8px}
.td .pr1,.td .pr2,.td .pr3,.td .pr4,.td .pr0{flex:none;border:0;border-radius:6px;font:inherit;font-size:10px;font-weight:700;min-width:24px;padding:2px 4px;cursor:pointer;color:#fff}
.td .pr1{background:#e5484d}.td .pr2{background:#f5a524}.td .pr3{background:#4f9dff}.td .pr4{background:#8b93a7}.td .pr0{background:none;color:var(--dim);border:1px dashed var(--line)}
.td select{flex:none;max-width:62px;font-size:11px;padding:2px 3px;border-radius:8px;color:var(--dim)}
.td button{border:0;background:none;color:var(--dim);font-size:12px;cursor:pointer;padding:2px 6px}
#todoNew{font-size:13px;padding:6px 10px}
#tproj,#tnote{font-size:13px;padding:6px 9px}   /* activity picker + description on the timer */
.tip{position:fixed;z-index:60;background:var(--txt);color:var(--bg);padding:8px 10px;border-radius:10px;font-size:12px;line-height:1.4;max-width:250px;box-shadow:0 6px 24px rgba(0,0,0,.35);pointer-events:none}
.tip b{display:block;margin-bottom:2px}.tip .tl{display:flex;justify-content:space-between;gap:14px;opacity:.9}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;padding:12px 14px;border-radius:14px;background:var(--txt);color:var(--bg);box-shadow:0 8px 30px rgba(0,0,0,.45);font-weight:600}
.hide{display:none!important}
@media(max-width:400px){h1{font-size:18px}.ring{width:116px;height:116px}.timer{font-size:26px}.tpanel{gap:12px;padding:12px}}
@media(max-width:340px){h1{display:none}.tsub .btn{flex:1 1 100%;padding:6px 4px}.ring{width:96px;height:96px}.timer{font-size:22px}}
</style></head><body><main>
<div class="top"><h1>🍅 Pomodoro</h1><button class="btn ico" id="refresh" title="Reload">↻</button><button class="btn ico hide" id="gear" title="Settings">⚙</button><button class="btn" id="auth">Log in</button></div>

<form class="card hide" id="login" autocomplete="on"><div class="row"><input type="password" id="pw" placeholder="Edit password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required><button class="btn pri" style="flex:0 0 auto">Log in</button></div></form>
<div class="card hide" id="todoCard"><h2>To do <button class="btn sm hide" id="todoClear" style="text-transform:none;letter-spacing:0;font-size:11px;padding:2px 8px">Clear finished</button></h2>
<div class="seg" id="todoTabs" style="display:flex;margin-bottom:6px;overflow-x:auto;scrollbar-width:none"></div>
<div id="todoList"></div><form id="todoForm" autocomplete="off" style="margin-top:6px"><input id="todoNew" placeholder="Add a to-do" maxlength="200" enterkeyhint="done" style="width:100%"></form></div>
<div class="card hide" id="timerCard"><div class="tpanel" id="tp"><div class="ring" id="ring"><div class="in"><div class="timer" id="clock">25:00</div><small id="phase">Focus</small></div></div>
<div class="tside"><div class="dots" id="dots"></div>
<select id="tproj"></select><input id="tnote" placeholder="What are you working on?" maxlength="300" enterkeyhint="done">
<button class="big" id="go">▶ Start</button>
<div class="tsub"><button class="btn" id="fin">Log now</button><button class="btn" id="skip">Skip</button><button class="btn" id="reset" title="Back to the first pomodoro of the day">Reset Day</button></div></div></div></div>

<div class="card"><h2>Today <span id="goalTxt"></span></h2><div class="bar" id="goalBar"></div><div id="todayTxt" style="color:var(--dim);font-size:13px"></div></div>
<div class="card"><div class="stats" id="stats"></div></div>
<div class="card"><h2>Last 12 months <span style="text-transform:none;letter-spacing:0" id="hmTxt"></span></h2><div class="hm" id="hm"></div>
<div class="hl">less <span class="c"></span><span class="c l1"></span><span class="c l2"></span><span class="c l3"></span><span class="c l4"></span><span class="c l5"></span><span class="c l6"></span><span class="c l7"></span><span class="c l8"></span><span class="c l9"></span><span class="c l10"></span> more</div></div>
<div class="card"><h2>By activity <span class="seg" id="range"><button data-r="7">Week</button><button data-r="30" class="on">Month</button><button data-r="0">All</button></span></h2><div id="byProj"></div></div>

<div class="card hide" id="setCard"><h2>Settings</h2>
<div class="set" id="setForm"></div><div id="pjList"></div>
<div class="pj"><input type="text" id="npName" placeholder="New activity" maxlength="60"><input type="color" id="npColor" value="#7c9cff"><button class="btn sm" id="npAdd">Add</button></div>
<div class="row" style="margin-top:12px"><a class="btn sm" href="/api/export.csv" style="text-decoration:none">Export CSV</a><button class="btn sm" id="pwBtn">Change password</button><button class="btn sm" id="mbBtn">Mac menu bar plugin</button><button class="btn sm" id="apiBtn">To-do API</button></div>
<div id="apiHelp" class="hide" style="margin-top:10px;font-size:13px;color:var(--dim);line-height:1.5"></div>
<div id="mbHelp" class="hide" style="margin-top:10px;font-size:13px;color:var(--dim);line-height:1.5"></div>
<form id="pwForm" class="hide" autocomplete="off" style="margin-top:10px"><div class="row"><input type="password" id="pwCur" placeholder="Current password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
<input type="password" id="pwNew" placeholder="New password (8+ characters)" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" minlength="8" required>
<input type="password" id="pwNew2" placeholder="New password again" autocomplete="new-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
<button class="btn pri" style="flex:0 0 auto">Save</button></div></form></div>


<div class="card"><h2>Sessions</h2><div id="list"></div></div>
</main><div class="toast hide" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
let HM=null;let S=null,T=null,offset=0,range=30,weeks=1;
const fmt=s=>{s=Math.round(s);return Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const fmtm=s=>Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const fromIso=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),2600)}
async function api(m,u,b){const r=await fetch(u,{method:m,headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});
 if(!r.ok){let e='';try{e=(await r.json()).detail}catch(_){}throw new Error(e||r.status)}return r.json()}
const pcolor=n=>(S.projects.find(p=>p.name==n)||{}).color||'#8b93a7';

async function load(){S=await api('GET','/api/state');render();if(S.edit){await loadTimer();syncLabel()}else{T=null}renderTimer()}
// project + note live on the SERVER (timer row): show them on every device, but never overwrite what is being typed right now
function syncLabel(){if(!T)return;projOptions($('tproj'),T.project);if(document.activeElement!==$('tnote'))$('tnote').value=T.note||''}
async function loadTimer(){const r=await api('GET','/api/timer');T=r.timer;offset=r.now-Date.now()}

function projOptions(sel,val){sel.innerHTML='<option value="">No activity</option>'+S.projects.map(p=>`<option>${esc(p.name)}</option>`).join('')+'<option value="__new">+ New activity…</option>';
 if(val&&!S.projects.some(p=>p.name==val)){sel.insertAdjacentHTML('afterbegin',`<option>${esc(val)}</option>`)}sel.value=val||''}

function render(){
 $('auth').textContent=S.edit?'Log out':'Log in';
 $('gear').classList.toggle('hide',!S.edit);$('timerCard').classList.toggle('hide',!S.edit);$('todoCard').classList.toggle('hide',!S.edit);renderTodos();
 if(!S.edit)$('setCard').classList.add('hide');
 const by={},focusBy={},actBy={};let total=0,pomos=0;   // actBy[day][activity] = seconds, for the heat map tooltip
 for(const s of S.sessions){by[s.day]=(by[s.day]||0)+s.seconds;((actBy[s.day]=actBy[s.day]||{})[s.project||'No activity']=(actBy[s.day][s.project||'No activity']||0)+s.seconds);total+=s.seconds;if(s.pomodoro){pomos++;focusBy[s.day]=(focusBy[s.day]||0)+1}}
 const st=S.settings,goal=st.daily_goal,goalSec=goal*st.focus_min*60,today=S.today;
 const td=by[today]||0,tp=focusBy[today]||0;
 $('goalTxt').textContent=`${tp} / ${goal} pomodoros`;
 $('goalBar').innerHTML=`<i style="width:${Math.min(100,td/goalSec*100)}%;background:${td>=goalSec?'var(--ok)':'var(--focus)'}"></i>`;
 $('todayTxt').textContent=`${fmt(td)} worked today`+(td>=goalSec?' · goal reached':` · ${fmtm(goalSec-td)} to go`);
 // stats
 const t0=fromIso(today),wk=new Date(t0);wk.setDate(wk.getDate()-((wk.getDay()+6)%7));
 let week=0,month=0;for(const[d,v]of Object.entries(by)){const x=fromIso(d);if(x>=wk)week+=v;if(x.getFullYear()==t0.getFullYear()&&x.getMonth()==t0.getMonth())month+=v}
 const days=Object.keys(by).sort(),first=days.length?fromIso(days[0]):t0,span=Math.max(1,Math.round((t0-first)/864e5)+1);
 const{cur,best:bestStreak}=streaks(by,t0,first);
 const nAct=days.length,best=Math.max(0,...Object.values(by)),nPom=Object.keys(focusBy).length;
 $('stats').innerHTML=[['Today',fmtm(td)],['This week',fmtm(week)],['This month',fmtm(month)],['Total',fmtm(total)],['Avg per day',fmtm(total/span)],['Avg per work day',fmtm(nAct?total/nAct:0)],
  ['Best day',fmtm(best)],['Days worked',nAct],['Pomodoros',pomos],['Pomodoros / day',nPom?(pomos/nPom).toFixed(1):'0'],['Streak',cur],['Longest streak',bestStreak]]
  .map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
 // heat map: 10 steps like the Chinese tracker: thresholds .125 .25 .5 .75 1 1.25 1.5 2 4 x the average per ACTIVE day (all history)
 const avgL=days.length?total/days.length:0,TH=[.125,.25,.5,.75,1,1.25,1.5,2,4].map(x=>x*avgL);
 const start=new Date(t0);start.setDate(start.getDate()-((start.getDay()+6)%7)-52*7);
 let h='<div class="wd"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span></span></div><div class="cols">',lastM=-1;
 for(let w=0;w<53;w++){const ws=new Date(start);ws.setDate(ws.getDate()+w*7);const m=ws.getMonth();
  h+=`<div class="mo">${m!=lastM?ws.toLocaleString('en',{month:'short'}):''}</div>`;if(m!=lastM)lastM=m;
  for(let d=0;d<7;d++){const x=new Date(ws);x.setDate(x.getDate()+d);const k=iso(x);
   if(x>t0){h+='<div class="c n"></div>';continue}
   const v=by[k]||0,l=!v?0:1+TH.filter(t=>v>=t).length;
   h+=`<div class="c${l?' l'+l:''}${k==today?' t':''}" data-d="${k}"></div>`}}
 HM={by,focusBy,actBy};hideTip();
 $('hm').innerHTML=h+'</div>';$('hm').scrollLeft=1e5;
 const act=Object.keys(by).filter(d=>fromIso(d)>=start).length;$('hmTxt').textContent=`${act} days`;
 // by project
 const cut=range?new Date(t0.getTime()-(range-1)*864e5):null,pj={};
 for(const s of S.sessions)if(!cut||fromIso(s.day)>=cut)pj[s.project||'No activity']=(pj[s.project||'No activity']||0)+s.seconds;
 const ent=Object.entries(pj).sort((a,b)=>b[1]-a[1]),mx=ent.length?ent[0][1]:1;
 $('byProj').innerHTML=ent.length?ent.map(([n,v])=>`<div class="pr"><div class="n"><i class="dot" style="background:${pcolor(n)}"></i>${esc(n)}</div><div class="bar"><i style="width:${v/mx*100}%;background:${pcolor(n)}"></i></div><div class="v">${fmtm(v)}</div></div>`).join(''):'<div style="color:var(--dim);font-size:13px">Nothing logged in this period.</div>';
 // list
 let l='',lastD='';const dayTot=by,cutoff=iso(new Date(t0.getTime()-(7*weeks-1)*864e5)),shown=S.sessions.filter(x=>x.day>=cutoff),more=S.sessions.length>shown.length;   // last 7 days, 'Load more' adds another week
 for(const s of shown){
  if(s.day!=lastD){lastD=s.day;l+=`<div class="day">${fromIso(s.day).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',year:'numeric'})}<span>${fmt(dayTot[s.day])}</span></div>`}
  l+=`<div class="sess"><i class="dot" style="background:${pcolor(s.project)}"></i><div class="m">${esc(s.project||'No activity')}${s.start?`<small>${s.start}–${s.end}${s.note?' · '+esc(s.note):''}</small>`:s.note?`<small>${esc(s.note)}</small>`:''}</div><div class="d">${fmt(s.seconds)}</div>${S.edit?`<button class="btn sm" data-x="${s.id}">✕</button>`:''}</div>`}
 if(!l)l=`<div style="color:var(--dim)">${S.sessions.length?`No sessions in the last ${7*weeks} days.`:'No sessions yet.'}</div>`;
 $('list').innerHTML=l+(more?'<div style="text-align:center;margin-top:12px"><button class="btn" data-more="1">Load more</button></div>':'');
 if(S.edit){projOptions($('tproj'),T?T.project:'');renderSettings()}
}

// Streaks: any day with work counts. Only a missed work day (Mon, Wed, Thu, Fri) breaks a streak; a free day (Tue, Sat, Sun) without work is skipped.
const WORK=[1,3,4,5];
function streaks(by,t0,first){
 let best=0,run=0;const x=new Date(first);
 while(x<=t0){if(by[iso(x)]){run++;best=Math.max(best,run)}else if(WORK.includes(x.getDay())&&iso(x)!=iso(t0))run=0;x.setDate(x.getDate()+1)}
 let cur=0;const d=new Date(t0);if(!by[iso(d)])d.setDate(d.getDate()-1);   // today without work yet does not break it
 while(d>=first){if(by[iso(d)])cur++;else if(WORK.includes(d.getDay()))break;d.setDate(d.getDate()-1)}
 return{cur,best}}

const TABS=[['todo','To Do'],['inprogress','In Progress'],['hold','On Hold'],['review','Review'],['finished','Finished']];
let tdTab='todo';const tdLimit={},tdOpen=new Set();let tdRefocus=null;   // tdOpen = tasks whose subtasks are showntry{const v=localStorage.getItem('pmTodoTab');if(TABS.some(t=>t[0]==v))tdTab=v}catch(_){}
function renderTodos(){const L=S.todos||[],n=k=>L.filter(t=>t.status==k).length;
 $('todoTabs').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${k==tdTab?'on':''}" style="flex:1 1 auto;padding:4px 3px;font-size:11px;white-space:nowrap">${l}${n(k)?`<sup style="font-size:9px;margin-left:2px;opacity:.8">${n(k)}</sup>`:''}</button>`).join('');
 $('todoClear').classList.toggle('hide',tdTab!='finished'||!n('finished'));$('todoForm').classList.toggle('hide',tdTab=='finished');
 const all=L.filter(t=>t.status==tdTab).sort((a,b)=>tdTab=='finished'?b.at-a.at:(a.prio||5)-(b.prio||5)||a.pos-b.pos||a.id-b.id),lim=tdLimit[tdTab]||10,items=all.slice(0,lim);   // 10 per tab, 'Load more' adds 10; sorted P1 first, no priority last, same priority = your drag order; Finished = newest finished first
 $('todoList').innerHTML=items.length?items.map(t=>{const subs=t.subs||[],dn=subs.filter(x=>x.done).length,open=tdOpen.has(t.id);return `<div class="tw" data-id="${t.id}"><div class="td${t.status=='finished'?' done':''}">${tdTab=='finished'?'':'<span class="h" data-drag="1" title="Drag to reorder (within the same priority)">⋮⋮</span>'}<input type="checkbox" data-t="${t.id}"${t.status=='finished'?' checked':''}><button class="pr${t.prio||0}" data-p="${t.id}" title="Priority (tap to change)">${t.prio?'P'+t.prio:'P'}</button><span class="tx">${esc(t.text)}</span><button class="sb${open?' on':''}" data-sb="${t.id}" title="Subtasks">${subs.length?dn+'/'+subs.length:'+'}</button>
  <select data-mv="${t.id}" title="Move to…"><option value="">Move</option>${TABS.filter(x=>x[0]!=t.status).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select><button data-tx="${t.id}" title="Delete">✕</button></div>${open?`<div class="subs">${subs.map(x=>`<div class="sub${x.done?' done':''}"><input type="checkbox" data-sc="${x.id}"${x.done?' checked':''}><span>${esc(x.text)}</span><button data-sx="${x.id}" title="Delete subtask">✕</button></div>`).join('')}<input class="sa" data-sa="${t.id}" placeholder="Add a subtask" maxlength="200" enterkeyhint="done"></div>`:''}</div>`}).join(''):`<div style="color:var(--dim);font-size:12px">${tdTab=='finished'?'Nothing finished yet.':'Nothing here.'}</div>`;
 if(tdRefocus){const el=$('todoList').querySelector(`[data-sa="${tdRefocus}"]`);if(el)el.focus();tdRefocus=null}
 if(all.length>lim)$('todoList').insertAdjacentHTML('beforeend',`<div style="text-align:center;margin-top:8px"><button class="btn sm" data-more="1">Load more (${all.length-lim})</button></div>`)}
async function todoCall(m,u,b){try{S.todos=(await api(m,u,b)).todos;renderTodos()}catch(e){toast(e.message)}}
$('todoTabs').onclick=e=>{const k=e.target.dataset.tab;if(!k)return;tdTab=k;try{localStorage.setItem('pmTodoTab',k)}catch(_){}renderTodos()};
$('todoForm').onsubmit=async e=>{e.preventDefault();const t=$('todoNew').value.trim();if(!t)return;$('todoNew').value='';await todoCall('POST','/api/todo',{text:t,status:tdTab})};
$('todoList').onchange=e=>{const id=e.target.dataset.t,mv=e.target.dataset.mv,sc=e.target.dataset.sc;if(sc)return todoCall('POST','/api/sub/'+sc,{done:e.target.checked});
 if(id)todoCall('POST','/api/todo/'+id,{status:e.target.checked?'finished':'todo'});else if(mv&&e.target.value)todoCall('POST','/api/todo/'+mv,{status:e.target.value})};
// tap the text of a task or subtask to rename it: Enter or leaving the box saves, Esc cancels
function editText(el,kind,id){if(el.querySelector('input'))return;const old=el.textContent;el.textContent='';
 const i=document.createElement('input');i.value=old;i.maxLength=200;i.style.cssText='width:100%;font-size:inherit;padding:2px 6px';el.appendChild(i);i.focus();i.select();let done=false;
 const finish=async save=>{if(done)return;done=true;const v=i.value.trim();if(save&&v&&v!==old)await todoCall('POST',(kind=='sub'?'/api/sub/':'/api/todo/')+id,{text:v});else renderTodos()};
 i.onkeydown=ev=>{if(ev.key==='Enter'){ev.preventDefault();finish(true)}else if(ev.key==='Escape')finish(false)};i.onblur=()=>finish(true)}
$('todoList').onclick=e=>{if(e.target.tagName==='INPUT')return;
 const tx=e.target.closest('.tx'),sp=e.target.closest('.sub span');
 if(tx)return editText(tx,'todo',tx.closest('.tw').dataset.id);
 if(sp)return editText(sp,'sub',sp.parentNode.querySelector('[data-sc]').dataset.sc);
 const sb=e.target.dataset.sb,sx=e.target.dataset.sx;
 if(sb){const i=+sb;tdOpen.has(i)?tdOpen.delete(i):tdOpen.add(i);return renderTodos()}
 if(sx)return todoCall('DELETE','/api/sub/'+sx);
 const pid=e.target.dataset.p;if(pid){const t=S.todos.find(x=>x.id==pid);return todoCall('POST','/api/todo/'+pid,{prio:((t.prio||0)+1)%5})}   // none > P1 > P2 > P3 > P4 > none
 if(e.target.dataset.more){tdLimit[tdTab]=(tdLimit[tdTab]||10)+10;return renderTodos()}const id=e.target.dataset.tx;if(id)todoCall('DELETE','/api/todo/'+id)};
$('todoList').addEventListener('keydown',e=>{const id=e.target.dataset&&e.target.dataset.sa;if(!id||e.key!=='Enter')return;e.preventDefault();const t=e.target.value.trim();if(!t)return;tdRefocus=id;todoCall('POST','/api/todo/'+id+'/sub',{text:t})});
// drag to reorder (pointer events: works with a finger and a mouse)
let drag=null;
$('todoList').addEventListener('pointerdown',e=>{const h=e.target.closest('[data-drag]');if(!h)return;drag=h.closest('.tw');drag.classList.add('drag');h.setPointerCapture(e.pointerId);e.preventDefault()});
$('todoList').addEventListener('pointermove',e=>{if(!drag)return;const el=document.elementFromPoint(e.clientX,e.clientY),row=el&&el.closest&&el.closest('#todoList .tw');
 if(row&&row!==drag){const r=row.getBoundingClientRect();row.parentNode.insertBefore(drag,e.clientY<r.top+r.height/2?row:row.nextSibling)}});
const endDrag=async()=>{if(!drag)return;const ids=[...$('todoList').querySelectorAll('.tw')].map(r=>+r.dataset.id);drag.classList.remove('drag');drag=null;await todoCall('POST','/api/todos/order',{ids})};
$('todoList').addEventListener('pointerup',endDrag);$('todoList').addEventListener('pointercancel',endDrag);
$('todoClear').onclick=()=>{if(confirm('Delete all finished to-dos?'))todoCall('DELETE','/api/todos/done')};

function renderSettings(){const st=S.settings,f=[['focus_min','Focus (min)'],['short_min','Short break'],['long_min','Long break'],['long_every','Long break after'],['daily_goal','Daily goal (pomodoros)']];
 if(!$('setForm').dataset.k||$('setForm').dataset.k!=JSON.stringify(st)){$('setForm').dataset.k=JSON.stringify(st);
  $('setForm').innerHTML=f.map(([k,n])=>`<label>${n}<input type="number" data-k="${k}" value="${st[k]}" inputmode="numeric"></label>`).join('')}
 $('pjList').innerHTML=S.projects.map(p=>`<div class="pj"><input type="color" value="${p.color}" data-pc="${esc(p.name)}"><span style="flex:1">${esc(p.name)}</span><button class="btn sm" data-pd="${esc(p.name)}">Remove</button></div>`).join('')}

// ---- heat map tooltip: hover with a mouse, tap on a phone
const tipEl=document.createElement('div');tipEl.className='tip hide';document.body.appendChild(tipEl);let tipCell=null;
function hideTip(){tipEl.classList.add('hide');tipCell=null}
function showTip(cell){if(!HM)return;const d=cell.dataset.d,sec=HM.by[d]||0,n=HM.focusBy[d]||0,acts=Object.entries(HM.actBy[d]||{}).sort((a,b)=>b[1]-a[1]);
 const title=fromIso(d).toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
 tipEl.innerHTML=`<b>${title}</b>`+(sec?`<div>${fmt(sec)} worked${n?` · ${n} pomodoro${n>1?'s':''}`:''}</div>`+acts.slice(0,5).map(([a,v])=>`<div class="tl"><span>${esc(a)}</span><span>${fmtm(v)}</span></div>`).join('')+(acts.length>5?`<div class="tl"><span>+ ${acts.length-5} more</span><span></span></div>`:''):'<div>Nothing logged</div>');
 tipEl.classList.remove('hide');tipCell=cell;const r=cell.getBoundingClientRect(),w=tipEl.offsetWidth,h=tipEl.offsetHeight;
 let x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8),y=r.top-h-8;if(y<8)y=r.bottom+8;tipEl.style.left=x+'px';tipEl.style.top=y+'px'}
$('hm').addEventListener('pointerover',e=>{if(e.pointerType==='touch')return;const c=e.target.closest('.c[data-d]');c?showTip(c):hideTip()});
$('hm').addEventListener('pointerleave',e=>{if(e.pointerType!=='touch')hideTip()});
$('hm').addEventListener('click',e=>{const c=e.target.closest('.c[data-d]');if(!c)return hideTip();tipCell===c?hideTip():showTip(c)});
$('hm').addEventListener('scroll',hideTip);document.addEventListener('click',e=>{if(!e.target.closest('#hm'))hideTip()});
// ---- timer
let completing=false;
function remaining(){const run=T.start?Date.now()+offset-T.start:0;return T.dur-(T.acc+run)}
function renderTimer(){
 if(!T||!S||!S.edit){document.title='Pomodoro';return}
 const rem=Math.max(0,remaining()),brk=T.phase!='focus',running=!!T.start;
 $('tp').classList.toggle('brk',brk);$('ring').classList.toggle('run',running);
 $('ring').style.setProperty('--p',(1-rem/T.dur)*360);
 const sec=Math.ceil(rem/1000);$('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');
 $('phase').textContent=T.phase=='focus'?'Focus':T.phase=='short'?'Short break':'Long break';
 $('go').textContent=running?'❚❚ Pause':(T.acc>0?'▶ Resume':'▶ Start');$('go').classList.toggle('pause',running);
 const every=S.settings.long_every;$('dots').innerHTML=Array.from({length:every},(_,i)=>`<i class="${i<T.cycle%every||(T.cycle>0&&T.cycle%every==0&&T.phase=='long')?'d':''}"></i>`).join('');
 const done=T.phase=='focus'?(T.acc+(T.start?Date.now()+offset-T.start:0))/1000:0;
 $('fin').classList.toggle('hide',!(T.phase=='focus'&&done>=60));$('skip').textContent=brk?'Skip break':'Reset Pomodoro';
 document.title=(running||T.acc>0?$('clock').textContent+' · ':'')+(brk?'Break':'Focus');
 if(running&&rem<=0&&!completing)complete()}
async function complete(){completing=true;const was=T.phase;try{const r=await api('POST','/api/timer/complete');T=r.timer;offset=r.now-Date.now();ping(was);S=await api('GET','/api/state');render()}catch(e){toast(e.message)}completing=false;renderTimer()}
function ping(was){toast(was=='focus'?'Pomodoro done — take a break':'Break over — back to work');
 try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.2);o.start();o.stop(a.currentTime+1.2)}catch(_){}
 try{if(window.Notification&&Notification.permission=='granted')new Notification(was=='focus'?'Pomodoro done':'Break over')}catch(_){}
 try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(_){}}
function label(){const p=$('tproj').value;return{project:p=='__new'?'':p,note:$('tnote').value}}
async function tcall(m,u,b){try{const r=await api(m,u,b);T=r.timer||T;offset=(r.now||Date.now())-Date.now();renderTimer();return r}catch(e){toast(e.message)}}

$('go').onclick=async()=>{if(window.Notification&&Notification.permission=='default')Notification.requestPermission();
 if(T.start)await tcall('POST','/api/timer/pause');else await tcall('POST','/api/timer/start',label())};
$('fin').onclick=async()=>{if(await tcall('POST','/api/timer/finish')){S=await api('GET','/api/state');render();toast('Logged')}};
$('skip').onclick=async()=>{if(T.phase=='focus'&&(T.acc||T.start)&&!confirm('Restart this pomodoro? The time so far is not logged.'))return;await tcall('POST','/api/timer/skip')};
$('reset').onclick=async()=>{if(!confirm('Reset the day? Time done on the current block is logged, then the timer starts again at pomodoro 1.'))return;const r=await tcall('DELETE','/api/timer');if(r){S=await api('GET','/api/state');render();if(r.logged)toast('Logged '+fmt(r.logged)+' on '+S.sessions[0].day);}};
$('tproj').onchange=async()=>{if($('tproj').value=='__new'){const n=(prompt('Activity name')||'').trim();if(n){await api('POST','/api/project',{name:n,color:'#7c9cff'});S=await api('GET','/api/state');render();$('tproj').value=n}else $('tproj').value=T.project}
 await tcall('POST','/api/timer/label',label())};
let noteT=null;const saveLabel=()=>{clearTimeout(noteT);noteT=null;return tcall('POST','/api/timer/label',label())};
$('tnote').oninput=()=>{clearTimeout(noteT);noteT=setTimeout(saveLabel,500)};   // saved while typing, not only when leaving the box
$('tnote').onchange=saveLabel;

// ---- form
$('list').onclick=async e=>{if(e.target.dataset.more){weeks++;return render()}const x=e.target.dataset.x;if(x){if(confirm('Delete this session?')){await api('DELETE','/api/session/'+x);await load()}return}};

// ---- settings
$('pwBtn').onclick=()=>$('pwForm').classList.toggle('hide');
$('pwForm').onsubmit=async e=>{e.preventDefault();if($('pwNew').value!==$('pwNew2').value)return toast('The new passwords do not match');
 try{await api('POST','/api/password',{current:$('pwCur').value,new:$('pwNew').value});$('pwForm').reset();$('pwForm').classList.add('hide');toast('Password changed. Other devices must log in again.')}catch(er){toast(er.message)}};
$('mbBtn').onclick=async()=>{if(!confirm('Download the menu bar plugin? This makes a new key and switches off any plugin you installed before.'))return;
 try{const r=await fetch('/api/menubar/key',{method:'POST'});if(!r.ok)throw new Error('failed');const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download='pomodoro.1s.sh';a.click();
  $('mbHelp').classList.remove('hide');$('mbHelp').innerHTML='<b style="color:var(--txt)">Install on your Mac</b><br>1. Install SwiftBar (free): <code>brew install --cask swiftbar</code> or from swiftbar.app, and pick a plugin folder when it asks.<br>2. Move <code>pomodoro.1s.sh</code> from Downloads into that folder.<br>3. In Terminal: <code>chmod +x &lt;plugin folder&gt;/pomodoro.1s.sh</code><br>The timer then shows in the menu bar, with your to-dos and their subtasks in its menu. Both keep working offline and sync when the site is reachable again. The file holds a key that can only control the timer: do not share it. Downloading again replaces the key.'}catch(e){toast(e.message)}};
function renderApi(tok){const o=location.origin,T=tok||'YOUR_TOKEN',c='style="word-break:break-all;display:block;background:var(--card2);padding:6px 8px;border-radius:8px;margin:4px 0;color:var(--txt);font-size:12px"';
 $('apiHelp').classList.remove('hide');
 $('apiHelp').innerHTML=`<b style="color:var(--txt)">To-do API</b> for scripts and shortcuts. The token can only add, list, change and delete to-dos.<br>
 ${tok?`<b style="color:var(--txt)">Your new token (shown once, copy it now):</b><input readonly value="${tok}" onclick="this.select()" style="width:100%;margin:6px 0"><br>`:S.api_token?'A token is active. A new one replaces it.<br>':'No token yet.<br>'}
 <div class="row" style="margin:6px 0"><button class="btn sm" id="apiNew">${S.api_token?'Make a new token':'Create token'}</button>${S.api_token?'<button class="btn sm" id="apiRevoke">Revoke token</button>':''}</div>
 Add a to-do (status todo|inprogress|hold|review|finished, prio 0-4):<code ${c}>curl -X POST ${o}/api/v1/todos -H "Authorization: Bearer ${T}" -H "Content-Type: application/json" -d '{"text":"Renew certificate","prio":2}'</code>
 Simplest form, e.g. for a Shortcut:<code ${c}>curl -X POST -H "Authorization: Bearer ${T}" "${o}/api/v1/todos?text=Buy%20milk"</code>
 Also: GET /api/v1/todos[?status=todo], PATCH /api/v1/todos/ID {"status":"finished"}, DELETE /api/v1/todos/ID. Subtasks: add "subtasks":["a","b"] to the POST body, or POST /api/v1/todos/ID/subtasks {"text":"…"}.`;
 $('apiNew').onclick=async()=>{if(S.api_token&&!confirm('Make a new token? The old one stops working.'))return;try{const r=await api('POST','/api/apitoken');S.api_token=true;renderApi(r.token)}catch(e){toast(e.message)}};
 if($('apiRevoke'))$('apiRevoke').onclick=async()=>{if(!confirm('Revoke the token? Anything using it stops working.'))return;try{await api('DELETE','/api/apitoken');S.api_token=false;renderApi(null)}catch(e){toast(e.message)}}}
$('apiBtn').onclick=()=>{if($('apiHelp').classList.contains('hide'))renderApi(null);else $('apiHelp').classList.add('hide')};
$('gear').onclick=()=>$('setCard').classList.toggle('hide');
$('setForm').onchange=async e=>{const k=e.target.dataset.k;if(!k)return;try{await api('POST','/api/settings',{[k]:+e.target.value});toast('Saved');if(T&&!T.start&&!T.acc&&k.endsWith('_min'))await tcall('DELETE','/api/timer');await load()}catch(er){toast(er.message);await load()}};
$('npAdd').onclick=async()=>{const n=$('npName').value.trim();if(!n)return;await api('POST','/api/project',{name:n,color:$('npColor').value});$('npName').value='';await load()};
$('pjList').onchange=async e=>{const n=e.target.dataset.pc;if(n){await api('POST','/api/project',{name:n,color:e.target.value});await load()}};
$('pjList').onclick=async e=>{const n=e.target.dataset.pd;if(n&&confirm(`Remove "${n}" from the list? Logged sessions keep the name.`)){await api('DELETE','/api/project/'+encodeURIComponent(n));await load()}};
$('range').onclick=e=>{const r=e.target.dataset.r;if(r==null)return;range=+r;for(const b of $('range').children)b.classList.toggle('on',b.dataset.r==r);render()};
$('refresh').onclick=()=>location.reload();
$('auth').onclick=async()=>{if(S.edit){await api('POST','/api/logout');return load()}$('login').classList.toggle('hide');if(!$('login').classList.contains('hide'))$('pw').focus()};
$('login').onsubmit=async e=>{e.preventDefault();try{await api('POST','/api/login',{password:$('pw').value.trim()});$('pw').value='';$('login').classList.add('hide');await load()}catch(er){toast('Wrong password')}};
setInterval(renderTimer,250);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&S.edit)load()});
load().catch(e=>toast(e.message));
